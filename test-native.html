<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Chrome 기본 PDF 뷰어 비교</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:#243247;background:#f4f6f9}
    header{padding:16px 20px}h1{font-size:20px;margin:0 0 10px}p{margin:8px 0;line-height:1.5}
    .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button,a{font:inherit}select,button{padding:8px;max-width:100%}a{color:#1759a8}
    iframe{display:block;width:100%;height:80vh;border:0;background:#525659}
    #status{color:#526477}#status.error{color:#b42318}
  </style>
</head>
<body>
  <header>
    <h1>Chrome 기본 PDF 뷰어 비교</h1>
    <p>Chrome에서 열어 기존 뷰어와 같은 PDF·페이지를 비슷한 글자 크기로 비교하세요. 브라우저 확대율은 100%로 맞추세요.</p>
    <div class="controls">
      <label for="book">문서</label><select id="book" disabled></select>
      <button id="reload" disabled>PDF 다시 열기</button>
      <a id="direct" target="_blank" rel="noopener" hidden>PDF를 새 탭에서 열기</a>
      <a href="./index.html" target="_blank" rel="noopener">기존 뷰어 열기</a>
    </div>
    <p id="status" role="status">문서 목록을 불러오는 중입니다.</p>
    <p>이 페이지는 브라우저 기본 뷰어를 사용합니다. Firefox에서는 엔진이 다르므로 Chrome으로 테스트하세요. 기본 뷰어의 저장·인쇄 기능은 제공될 수 있습니다.</p>
  </header>
  <iframe id="pdf" title="브라우저 기본 PDF 뷰어"></iframe>
  <script type="module" src="./js/test-native.js?v=20261017native"></script>
</body>
</html>
